name: Fix Video Converter UI

on:
  push:
    branches: [main]
    paths:
      - tools/fix_video_converter_ui.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Video Converter CSS
        run: python tools/fix_video_converter_ui.py
      - name: Commit UI fix
        run: |
          if git diff --quiet -- video-converter.html; then
            echo "No video-converter.html changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add video-converter.html
          git commit -m "Fix Video Converter interface layout"
          git push
